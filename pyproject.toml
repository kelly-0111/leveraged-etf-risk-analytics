[project]
name = "etf-risk"
version = "0.1.0"
description = "Daily-reset leveraged return model on historical stock returns, with a PySpark batch version."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2,<3",  # PySpark 4.2 warns pandas 3 is not fully supported
    "pandas-market-calendars==5.5.0",  # exact: trading-calendar checks depend on its holiday rules
    "pyarrow>=18",
    "pyspark>=4.0",
]

[dependency-groups]
dev = ["pytest>=8"]
download = [
    "yfinance==1.7.0",
]
jobs = [
    "confluent-kafka==2.16.0",  # exact: the job queue's Kafka settings and live tests depend on it
    "psutil==7.2.2",            # exact, as in `measure`: the worker finds and ends a step's processes with it
    "pymysql[rsa]==1.1.1",      # exact: the job table's MySQL adapter and live tests depend on it
]
measure = [
    "psutil==7.2.2",  # exact: peak-memory measurements depend on it
]
plots = [
    "matplotlib==3.11.2",  # exact: the committed figures' rendering depends on it
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: starts a local SparkSession (slower)"]
